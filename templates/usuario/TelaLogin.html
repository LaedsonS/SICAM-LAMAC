<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
         body{
            background-color: #8dd0d7;
        }   
        #nav {
            background-color: #163646;
        }
        #titulo {
            margin: 4px;
            background-color: #f2f4f3;
            border: 5px solid #163646;
            border-radius: 5px;
        }
        h1, h2 {
            color: #7f222f;
            border-radius: 5px;
            margin: 10px 3px;
            padding: 10px 20px;
            background-color: #f2f4f3;
            font-family: "Merriweather", serif;
            font-style: italic;         
        }
        main {
            background-color: #f2f4f3;
            margin-top: 20px;
            padding: 5px;
            width: 90%;
            border: 2px solid #163646;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        #input {
            padding: 1px;
            background-color: #163646;
            border: 2px solid #141115;
            border-radius: 5px;
        }
        button[type="submit"] {
            background-color: #163646;
            color: #8dd0d7;
        } 
        button[type="submit"]:hover {
            border-radius: 5px;
            border: 2px solid #534d55;
            background-color: #ea1e5e;
        }
    </style>
    <title>Tela login</title>
</head>
<body>
    <div id="titulo">
        <h1>SICAM-LAMAC</h1>
        <h2>Sistema de Cadastro para a Manutenção de Máquinas no LAMAC</h2>
    </div>
    <main class="container-sm">
        <div class="input-group input-group-lg mb-3" id="input">
            <span class="input-group-text" id="inputGroup-sizing-sm">Matrícula</span>
            <input type="text" class="form-control is-invalid" id="floatingInputGroup2" placeholder="Informe sua matrícula" required>
        </div>

        <div class="input-group input-group-lg mb-3" id="input">
            <span class="input-group-text" id="inputGroup-sizing-sm">Senha</span>
            <input type="password" class="form-control is-invalid" id="floatingInputGroup2" placeholder="Informe sua senha" required>
        </div>
        
        <button class="btn btn-lg" type="submit">Fazer login</button>
        <button class="btn   btn-sm" type="submit" onclick="mudarParaCadastro()">Cadastrar-se</button>
    <script>
        function mudarParaCadastro() {
            window.location.href = "TelaCadastro.html"
        }
    </script>
</body>
</html>
